name: CI/CD - Azure Web App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      targetEnvironment:
        description: Deployment target environment
        required: true
        default: prd
        type: choice
        options:
          - tst
          - prd

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'
  TARGET_ENV: ${{ github.event_name == 'pull_request' && 'tst' || github.event_name == 'workflow_dispatch' && inputs.targetEnvironment || 'prd' }}
  DEFAULT_WEBAPP_NAME_TST: cookboek-tst-api
  DEFAULT_WEBAPP_NAME_PRD: cookboek-prd-api
  AZURE_WEBAPP_NAME_PRD: ${{ vars.AZURE_WEBAPP_NAME_PRD != '' && vars.AZURE_WEBAPP_NAME_PRD || secrets.AZURE_WEBAPP_NAME_PRD }}
  AZURE_WEBAPP_NAME_TST: ${{ vars.AZURE_WEBAPP_NAME_TST != '' && vars.AZURE_WEBAPP_NAME_TST || secrets.AZURE_WEBAPP_NAME_TST }}
  AZURE_WEBAPP_NAME_DEFAULT: ${{ vars.AZURE_WEBAPP_NAME != '' && vars.AZURE_WEBAPP_NAME || secrets.AZURE_WEBAPP_NAME }}
  HAS_PUBLISH_PROFILE_TST: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TST != '' || secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
  HAS_PUBLISH_PROFILE_PRD: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRD != '' || secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
  HAS_OIDC: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
  HAS_SP_SECRET: ${{ secrets.AZURE_CREDENTIALS != '' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'tst' || github.event_name == 'workflow_dispatch' && inputs.targetEnvironment || 'prd' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guardrail - block prd outside main
        run: |
          if [ "${TARGET_ENV}" = "prd" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Production deployment is only allowed from main."
            echo "Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Resolve target app name
        run: |
          if [ "${TARGET_ENV}" = "tst" ]; then
            SELECTED_NAME="${AZURE_WEBAPP_NAME_TST}"
            if [ -z "${SELECTED_NAME}" ]; then
              SELECTED_NAME="${DEFAULT_WEBAPP_NAME_TST}"
            fi
          else
            SELECTED_NAME="${AZURE_WEBAPP_NAME_PRD}"
            if [ -z "${SELECTED_NAME}" ]; then
              SELECTED_NAME="${DEFAULT_WEBAPP_NAME_PRD}"
            fi
          fi

          # Backward compatibility with single-name setup.
          if [ -z "${SELECTED_NAME}" ]; then
            SELECTED_NAME="${AZURE_WEBAPP_NAME_DEFAULT}"
          fi

          echo "AZURE_WEBAPP_NAME=${SELECTED_NAME}" >> "$GITHUB_ENV"

      - name: Ensure Azure Web App name is configured
        run: |
          if [ -z "${AZURE_WEBAPP_NAME}" ]; then
            echo "Missing web app name for target environment '${TARGET_ENV}'."
            echo "Set AZURE_WEBAPP_NAME_${TARGET_ENV^^}, or fallback AZURE_WEBAPP_NAME."
            exit 1
          fi

      - name: Deploy to Azure Web App with publish profile
        if: ${{ (env.TARGET_ENV == 'tst' && env.HAS_PUBLISH_PROFILE_TST == 'true') || (env.TARGET_ENV != 'tst' && env.HAS_PUBLISH_PROFILE_PRD == 'true') }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ env.TARGET_ENV == 'tst' && (secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TST != '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TST || secrets.AZURE_WEBAPP_PUBLISH_PROFILE) || (secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRD != '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRD || secrets.AZURE_WEBAPP_PUBLISH_PROFILE) }}
          package: .

      - name: Azure login with OIDC (preferred)
        if: ${{ ((env.TARGET_ENV == 'tst' && env.HAS_PUBLISH_PROFILE_TST != 'true') || (env.TARGET_ENV != 'tst' && env.HAS_PUBLISH_PROFILE_PRD != 'true')) && env.HAS_OIDC == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login with service principal secret (fallback)
        if: ${{ ((env.TARGET_ENV == 'tst' && env.HAS_PUBLISH_PROFILE_TST != 'true') || (env.TARGET_ENV != 'tst' && env.HAS_PUBLISH_PROFILE_PRD != 'true')) && env.HAS_OIDC != 'true' && env.HAS_SP_SECRET == 'true' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fail when no deployment auth method is configured
        if: ${{ ((env.TARGET_ENV == 'tst' && env.HAS_PUBLISH_PROFILE_TST != 'true') || (env.TARGET_ENV != 'tst' && env.HAS_PUBLISH_PROFILE_PRD != 'true')) && env.HAS_OIDC != 'true' && env.HAS_SP_SECRET != 'true' }}
        run: |
          echo "No deployment auth configured for target '${TARGET_ENV}'."
          echo "Set AZURE_WEBAPP_PUBLISH_PROFILE_${TARGET_ENV^^} (or AZURE_WEBAPP_PUBLISH_PROFILE),"
          echo "or configure OIDC secrets (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID),"
          echo "or set AZURE_CREDENTIALS as a JSON service principal secret."
          exit 1

      - name: Deploy to Azure Web App
        if: ${{ (env.TARGET_ENV == 'tst' && env.HAS_PUBLISH_PROFILE_TST != 'true') || (env.TARGET_ENV != 'tst' && env.HAS_PUBLISH_PROFILE_PRD != 'true') }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .
